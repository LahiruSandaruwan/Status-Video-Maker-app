name: statuspro
description: Viral Video Status Maker for WhatsApp, Instagram & Facebook
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Video & Media
  ffmpeg_kit_flutter: ^6.0.3
  video_player: ^2.8.2
  video_thumbnail: ^0.5.3
  image_picker: ^1.0.7
  image: ^4.1.7
  photo_view: ^0.14.0

  # UI & Animations
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  flutter_colorpicker: ^1.0.3

  # State Management
  provider: ^6.1.2

  # Storage & Data
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

  # Sharing & Permissions
  share_plus: ^7.2.2
  permission_handler: ^11.3.0

  # Ads
  google_mobile_ads: ^5.0.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/backgrounds/
    - assets/music/
    - assets/stickers/
    - assets/lottie/
    - assets/fonts/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
